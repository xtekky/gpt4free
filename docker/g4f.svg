<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="g4f">
  <!-- g4f mark (https://g4f.dev/dist/img/g4f.svg): brand-gradient circle + G4F.
       Referenced by docker/novnc-brand.sh as the sandbox desktop's noVNC logo,
       favicon and icon asset, so keep the ids g4f-prefixed. -->
  <defs>
    <linearGradient id="g4fGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6e48aa"/>
      <stop offset="100%" style="stop-color:#4776E6"/>
    </linearGradient>
    <filter id="g4fGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#g4fGrad)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <text x="250" y="328" font-family="Arial,Helvetica,sans-serif" font-size="194"
        font-weight="900" fill="#f8f9fa" text-anchor="middle" letter-spacing="-5"
        filter="url(#g4fGlow)">G4F</text>
</svg>
