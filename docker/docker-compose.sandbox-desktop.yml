# Sandbox desktop: TigerVNC + Xfce + noVNC + g4f API in one container.
# The entrypoint starts Xvnc and Xfce automatically and exports DISPLAY, so a
# browser opened from the desktop menu (Install & Open Chrome) renders there.
#   docker compose -f docker/docker-compose.sandbox-desktop.yml up -d
# Desktop: http://172.0.0.1:8080/desktop/  (g4f-branded noVNC client -> Xvnc :0,
#          served by the g4f API itself; index.html embeds it full-viewport)
# API:     http://172.0.0.1:8080        (same server and port as the desktop)
# Apps:    http://g4f.g4f.local/  (also <port>.g4f.local, e.g.
#          http://20128.g4f.local/) — the entrypoint seeds /etc/hosts from
#          g4f/api/domain_router.py, so no extra_hosts are needed here.
#
# The ports are published on SANDBOX_BIND_ADDR (default: 172.0.0.1), not on
# every host interface. Set it to 127.0.0.1 for localhost or 0.0.0.0 to expose
# the desktop on the LAN.
#
# The image also installs an egress firewall: containers can reach the public
# internet but not private/link-local/reserved networks (the host LAN, other
# Docker networks, cloud metadata). It needs CAP_NET_ADMIN, added below; set
# SANDBOX_BLOCK_LOCAL_NETWORK=0 to disable it.
#
# Set SANDBOX_DESKTOP=0 in environment to skip the desktop stack.
services:
  sandbox-desktop:
    image: g4f-sandbox:desktop
    build:
      context: ..
      dockerfile: docker/Dockerfile-sandbox-desktop
      args:
        # Match the host uid to avoid permission problems on bind mounts.
        G4F_USER_ID: ${G4F_USER_ID:-1000}
    container_name: g4f-sandbox-desktop
    hostname: sandbox
    init: true
    shm_size: 2gb
    # iptables needs NET_ADMIN for the sandbox egress filter.
    cap_add:
      - NET_ADMIN
    ports:
      - "${SANDBOX_BIND_ADDR:-172.0.0.1}:8080:8080"   # g4f API server + noVNC desktop (custom routes /desktop/, /desktop/websockify)
      - "${SANDBOX_BIND_ADDR:-172.0.0.1}:5900:5900"   # Xvnc display :0 (direct VNC clients)
      - "${SANDBOX_BIND_ADDR:-172.0.0.1}:8602:8602"
    volumes:
      - ../:/app/gpt4free
    environment:
      - XDG_RUNTIME_DIR=/tmp/sandbox-runtime
      - SANDBOX_BLOCK_LOCAL_NETWORK=${SANDBOX_BLOCK_LOCAL_NETWORK:-1}
      # - SANDBOX_DESKTOP=0
