<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Providers - GPT4Free | Browse 100+ Free AI Models</title>
    <meta name="description" content="Browse all AI providers supported by GPT4Free. Find free AI chat, image generation, and text models from OpenAI, Anthropic, Google, Meta, and more.">
    <meta name="keywords" content="AI providers, GPT4Free, free AI, OpenAI, Anthropic, Google AI, Meta AI, text generation, image generation, AI chat, free AI models">
    <meta name="author" content="GPT4Free Team">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="AI Providers - GPT4Free">
    <meta property="og:description" content="Browse all AI providers supported by GPT4Free. Free access to 100+ AI models.">
    <meta property="og:url" content="https://g4f.space/providers">
    <meta property="og:site_name" content="GPT4Free">
    <meta property="og:image" content="https://g4f.space/screenshot/providers">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AI Providers - GPT4Free">
    <meta name="twitter:description" content="Browse all AI providers supported by GPT4Free. Free access to 100+ AI models.">
    <meta name="twitter:image" content="https://g4f.space/screenshot/providers">

    <!-- Canonical -->
    <link rel="canonical" href="https://g4f.space/providers">

    <style>
        :root {
            --primary: #6e48aa;
            --secondary: #9d50bb;
            --accent: #4776E6;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --card-bg: rgba(255,255,255,0.05);
            --card-border: rgba(255,255,255,0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--dark), #16213e);
            color: var(--light);
            min-height: 100vh;
        }

        .navbar {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--light);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--secondary);
        }

        .main-container {
            padding: 6rem 2rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-size: 2.2rem;
            margin: 0 0 0.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .page-header p {
            color: rgba(255,255,255,0.6);
            margin: 0;
            font-size: 1.05rem;
        }

        .providers-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .provider-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .provider-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .provider-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .provider-url {
            color: var(--accent);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .provider-details {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #a0aec0;
        }

        .provider-details strong {
            color: var(--accent);
        }

        .provider-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--card-border);
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #5a45d6;
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: #8a82b8;
        }

        .no-providers {
            text-align: center;
            padding: 4rem;
            color: var(--warning);
        }

        /* ---- Provider detail page ---- */
        .detail-header h1 {
            font-size: 2.2rem;
            margin: 0 0 0.25rem;
            background: linear-gradient(to right, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .detail-subtitle {
            color: rgba(255,255,255,0.5);
            margin: 0 0 1.5rem;
            font-size: 0.95rem;
        }

        .nav-prev-next {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--light);
        }
        .nav-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--accent);
        }
        .nav-prev { color: var(--accent); }
        .nav-next { color: var(--accent); }
        .nav-back { color: rgba(255,255,255,0.6); }

        .detail-grid {
            display: grid;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        @media (max-width: 768px) {
            .detail-grid { grid-template-columns: 1fr; }
        }

        .detail-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
        }
        .detail-card h2 {
            font-size: 1.1rem;
            margin: 0 0 1rem;
            color: var(--accent);
        }

        .attr-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .attr-table th {
            text-align: left;
            padding: 0.5rem 0.75rem;
            color: rgba(255,255,255,0.5);
            font-weight: 500;
            border-bottom: 1px solid var(--card-border);
            white-space: nowrap;
        }
        .attr-table td {
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #c9d1d9;
        }
        .attr-table a { color: var(--accent); text-decoration: none; }
        .attr-table a:hover { text-decoration: underline; }

        .screenshot-section { text-align: center; }
        .screenshot-caption {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            margin-top: 0.5rem;
        }

        .model-list, .param-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .model-list li, .param-list li {
            background: rgba(71,118,230,0.15);
            border: 1px solid rgba(71,118,230,0.3);
            color: #79c0ff;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: ui-monospace, monospace;
        }
        .param-list li {
            background: rgba(157,80,187,0.15);
            border-color: rgba(157,80,187,0.3);
            color: #d2a8ff;
        }

        .detail-models { margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">G4F</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/chat/">Chat</a>
            <a href="/providers/">Providers</a>
            <a href="/stats/">Stats</a>
        </div>
    </nav>

    <main class="main-container">
        <!-- CONTENT_START -->
        <div class="page-header">
            <h1>Available Providers</h1>
            <p>Browse the list of AI providers supported by G4F</p>
        </div>

        <div class="providers-list">
            <!-- Providers will be populated dynamically -->
            <div class="no-providers">
                <p>Loading providers...</p>
            </div>
        </div>
        <!-- CONTENT_END -->
    </main>
</body>
</html>
