    <!-- Twitter Card -->

    <meta name="twitter:image" content="https://g4f.space/screenshot/providers">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">

    <style>
        /* ---- Providers grid ---- */
        .providers-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .provider-card {
            padding: 1.75rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .provider-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(to right, transparent, var(--accent-light), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .provider-card:hover::before {
            opacity: 1;
        }

        .provider-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #fff;
        }

        .provider-url {
            color: var(--accent-light);
            font-size: 0.9rem;
            margin-bottom: 0.6rem;
            word-break: break-all;
        }

        .provider-details {
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .provider-details strong {
            color: var(--accent-light);
        }

        .provider-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 1.25rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border-card);
        }

        .no-providers {
            text-align: center;
            padding: 4rem;
            color: var(--warning);
        }

        /* ---- Provider detail page ---- */
        .detail-header h1 {
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin: 0 0 0.35rem;
            background: linear-gradient(135deg, #ffffff 0%, #e9d5ff 50%, #c084fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .detail-subtitle {
            color: var(--text-muted);
            margin: 0 0 1.75rem;
            font-size: 0.95rem;
        }

        .nav-prev-next {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .nav-prev-next-bottom {
            margin-top: 2rem;
        }

        .nav-btn {
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            border: 1px solid var(--border-card);
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .nav-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-light);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .nav-prev { color: var(--accent-light); }
        .nav-next { color: var(--accent-light); }
        .nav-back { color: var(--text-secondary); }

        .detail-grid {
            display: grid;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 768px) {
            .detail-grid { grid-template-columns: 1fr; }
        }

        .detail-card {
            padding: 1.75rem;
        }

        .detail-card h2 {
            font-size: 1.1rem;
            font-weight: 800;
            margin: 0 0 1rem;
            color: var(--accent-light);
        }

        .attr-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .attr-table th {
            text-align: left;
            padding: 0.6rem 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 1px solid var(--border-card);
            white-space: nowrap;
        }

        .attr-table td {
            padding: 0.6rem 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .attr-table a { color: var(--accent-light); text-decoration: none; }
        .attr-table a:hover { text-decoration: underline; }

        .screenshot-section { text-align: center; }

        .screenshot-caption {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .provider-logo {
            width: 96px;
            height: 96px;
            border-radius: 16px;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-card);
        }

        .model-list, .param-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .model-list li, .param-list li {
            background: rgba(139, 61, 255, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #d8b4fe;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: ui-monospace, monospace;
        }

        .param-list li {
            background: rgba(168, 85, 247, 0.12);
            border-color: rgba(168, 85, 247, 0.25);
            color: #e9d5ff;
        }

        .detail-models { margin-bottom: 1.5rem; }

        /* ---- Language overlay ---- */
        .lang-overlay {
            position: fixed;
            inset: 0;
            z-index: 1200;
            background: rgba(6, 4, 12, 0.82);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .lang-overlay.hidden { display: none; }

        .lang-overlay-frame {
            width: min(1100px, 100%);
            height: min(760px, 100%);
            border: 1px solid var(--border-card);
            border-radius: var(--radius);
            background: var(--bg-main);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
        }

        .lang-btn {
            background: rgba(139, 61, 255, 0.15);
            border: 1px solid var(--border-card);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .lang-btn:hover {
            background: var(--accent);
            border-color: var(--accent-light);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .lang-btn .fa-spinner {
            display: none;
        }

        .lang-btn.busy .fa-spinner {
            display: inline-block;
            animation: lang-spin 0.8s linear infinite;
        }

        @keyframes lang-spin { to { transform: rotate(360deg); } }

        .nav-tools {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
    </style>
</head>
<body class="translate">
    <nav class="navbar">
        <a href="/" class="brand">
            <div class="brand-logo">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <span class="brand-text">G4F Framework</span>
        </a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/chat/">Chat</a>
            <a href="/providers/" class="active">Providers</a>
            <a href="/stats/">Stats</a>
            <div class="nav-tools">
                <button type="button" class="lang-btn" id="language-btn" aria-label="Open language selection">
                    <i class="fa-solid fa-globe" aria-hidden="true"></i>
                    <span>Language</span>
                </button>
                <button type="button" class="lang-btn" id="translate-btn" aria-label="Translate user interface">
                    <i class="fa-solid fa-language" aria-hidden="true"></i>
                    <span>Translate UI</span>
                    <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <!-- CONTENT_START -->
        <div class="page-header">
            <h1>Available Providers</h1>
            <p>Browse the list of AI providers supported by G4F</p>
        </div>

        <div class="providers-list">
            <!-- Providers will be populated dynamically -->
            <div class="no-providers">
                <p>Loading providers...</p>
            </div>
        </div>
        <!-- CONTENT_END -->
    </main>

    <footer class="footer">
        <p>&copy; 2026 G4F Framework. All Rights Reserved. | <a href="https://github.com/xtekky/gpt4free" target="_blank" rel="noopener noreferrer">GitHub Repository</a></p>
    </footer>

    <!-- Language selection overlay: the selection page is opened in a frame,
         it posts back "g4f-language:changed" so this page reloads and picks
         up the newly loaded translation package. -->
    <div class="lang-overlay hidden" id="lang-overlay" aria-hidden="true">
        <iframe class="lang-overlay-frame" id="lang-overlay-frame" title="Language selection"
                src="about:blank"></iframe>
    </div>

    <script>
        (function () {
            "use strict";

            const overlay = document.getElementById("lang-overlay");
            const frame = document.getElementById("lang-overlay-frame");
            const languageBtn = document.getElementById("language-btn");
            const translateBtn = document.getElementById("translate-btn");

            /* ---- Placeholder templates ------------------------------------
             * Elements with a "data-tpl" attribute hold a template like
             * "Provider #{0} of {1}". The template is translated as a whole
             * and the placeholders are filled with the "data-a<n>" values.
             * The framework only translates plain text nodes, so these
             * elements are handled here. */
            const applyTemplates = () => {
                document.querySelectorAll("[data-tpl]").forEach((el) => {
                    const tpl = el.getAttribute("data-tpl") || "";
                    let text = tpl;
                    if (window.framework && framework.translate) {
                        try {
                            const translated = framework.translate(tpl, false);
                            // Only apply the translation when it kept every
                            // placeholder, otherwise the numbers would break.
                            const holes = tpl.match(/\{\d+\}/g) || [];
                            if (holes.every((hole) => translated.includes(hole))) {
                                text = translated;
                            }
                        } catch (e) { /* keep the raw template */ }
                    }
                    text = text.replace(/\{(\d+)\}/g, (match, index) => {
                        const value = el.getAttribute("data-a" + index);
                        return value !== null && value !== undefined ? value : match;
                    });
                    el.textContent = text;
                });
            };

            const closeOverlay = () => {
                overlay.classList.add("hidden");
                overlay.setAttribute("aria-hidden", "true");
                frame.src = "about:blank";
            };

            const openOverlay = () => {
                frame.src = "/language-selection.html";
                overlay.classList.remove("hidden");
                overlay.setAttribute("aria-hidden", "false");
            };

            if (languageBtn) {
                languageBtn.addEventListener("click", openOverlay);
            }
            overlay.addEventListener("click", (event) => {
                if (event.target === overlay) closeOverlay();
            });

            window.addEventListener("message", (event) => {
                if (event.origin !== location.origin) return;
                const data = event.data || {};
                if (data.type === "g4f-language:changed" || data.type === "g4f-language:dismiss") {
                    closeOverlay();
                    // Reload so the framework rebuilds its translations from the
                    // newly selected language package.
                    if (data.type === "g4f-language:changed") {
                        window.location.reload();
                    }
                }
            });

            if (translateBtn) {
                translateBtn.addEventListener("click", () => {
                    if (!window.framework || !framework.translateAll) return;
                    translateBtn.classList.add("busy");
                    framework.translateAll()
                        .catch(() => {})
                        .finally(() => {
                            translateBtn.classList.remove("busy");
                            applyTemplates();
                        });
                });
            }

            // Re-render the templates whenever the framework (re)applies its
            // translations, so placeholder texts stay in sync with the UI.
            const install = () => {
                if (!window.framework) return false;
                if (!framework.__providersTranslateWrapped && framework.translateAll) {
                    const original = framework.translateAll.bind(framework);
                    framework.translateAll = function (...args) {
                        return original(...args).then((result) => {
                            applyTemplates();
                            return result;
                        });
                    };
                    framework.__providersTranslateWrapped = true;
                }
                applyTemplates();
                return true;
            };

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", () => {
                    if (!install()) {
                        // framework.js is deferred — retry once it is ready.
                        window.addEventListener("load", install, { once: true });
                    }
                });
            } else {
                if (!install()) {
                    window.addEventListener("load", install, { once: true });
                }
            }
        })();
    </script>
</body>
</html>
