  # WinGet Package Manifest
  create-winget-manifest:
    runs-on: ubuntu-latest
    needs: [prepare, build-g4f-go]
    if: needs.prepare.outputs.is_release == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Download g4f-go Windows zip
        uses: actions/download-artifact@v4
        with:
          name: g4f-go-windows
          path: ./artifacts/windows
      - name: Calculate hash and size of ZIP
        id: hash
        run: |
          HASH_X64=$(sha256sum ./artifacts/windows/dist/g4f-go-*-windows-amd64.zip | cut -d' ' -f1)
          echo "hash_x64=${HASH_X64}" >> $GITHUB_OUTPUT
          SIZE_X64=$(stat -c%s ./artifacts/windows/dist/g4f-go-*-windows-amd64.zip)
          echo "size_x64=${SIZE_X64}" >> $GITHUB_OUTPUT
      - name: Create WinGet manifest
        run: |
          mkdir -p winget/manifests/g/g4f/${{ needs.prepare.outputs.version }}

          # Version manifest
          cat > winget/manifests/g/g4f/${{ needs.prepare.outputs.version }}/g4f.yaml << EOF
          PackageIdentifier: g4f
          PackageVersion: ${{ needs.prepare.outputs.version }}
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.4.0
          EOF

          # Installer manifest
          cat > winget/manifests/g/g4f/${{ needs.prepare.outputs.version }}/g4f.installer.yaml << EOF
          PackageIdentifier: g4f
          PackageVersion: ${{ needs.prepare.outputs.version }}
          Installers:
          - Architecture: x64
            InstallerType: zip
            NestedInstallerType: portable
            NestedInstallerFiles:
            - RelativeFilePath: g4f-go.exe
              PortableCommandAlias: g4f
            InstallerUrl: https://github.com/xtekky/gpt4free/releases/download/${{ needs.prepare.outputs.version }}/g4f-go-${{ needs.prepare.outputs.version }}-windows-amd64.zip
            InstallerSha256: ${{ steps.hash.outputs.hash_x64 }}
          ManifestType: installer
          ManifestVersion: 1.4.0
          EOF

          # Locale manifest
          cat > winget/manifests/g/g4f/${{ needs.prepare.outputs.version }}/g4f.locale.en-US.yaml << EOF
          PackageIdentifier: g4f
          PackageVersion: ${{ needs.prepare.outputs.version }}
          PackageLocale: en-US
          Publisher: GPT4Free
          PublisherUrl: https://github.com/xtekky/gpt4free
          PackageName: g4f
          PackageUrl: https://github.com/xtekky/gpt4free
          License: GPL-3.0
          LicenseUrl: https://github.com/xtekky/gpt4free/blob/main/LICENSE
          ShortDescription: The official gpt4free repository
          Description: Various collection of powerful language models
          Tags:
          - ai
          - gpt
          - chatgpt
          - openai
          - free
          - client
          ManifestType: defaultLocale
          ManifestVersion: 1.4.0
          EOF
      - name: Upload WinGet manifest
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifest
          path: winget/

  # Release Creation
  create-release:
    runs-on: ubuntu-latest
    needs: [prepare, build-pypi, build-g4f-go, create-winget-manifest]
    if: needs.prepare.outputs.is_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Display artifact structure
        run: |
          echo "Downloaded artifacts:"
          find ./artifacts -type f -name "*" | sort
      - name: Create Release with Assets
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          append_body: true
          body: |
            ### Download Options

            **Python Package:**
            - PyPI: `pip install g4f==${{ needs.prepare.outputs.version }}`

            **Executables (g4f-go, self-contained with embedded Python):**
            - Windows amd64: `g4f-go-${{ needs.prepare.outputs.version }}-windows-amd64.zip`
            - Linux x64: `g4f-go-${{ needs.prepare.outputs.version }}-linux-amd64.zip`
            - Linux ARM64: `g4f-go-${{ needs.prepare.outputs.version }}-linux-arm64.zip`
            - macOS x64: `g4f-go-${{ needs.prepare.outputs.version }}-darwin-amd64.zip`
            - macOS ARM64: `g4f-go-${{ needs.prepare.outputs.version }}-darwin-arm64.zip`
            - FreeBSD amd64: `g4f-go-${{ needs.prepare.outputs.version }}-freebsd-amd64.zip`

            **System Packages:**
            - WinGet: `winget install gpt4free`

            **Docker:**
            - `docker pull hlohaus789/g4f:${{ needs.prepare.outputs.version }}`
            - `docker pull hlohaus789/g4f:${{ needs.prepare.outputs.version }}-slim`

            💻 **Having trouble with the .exe from this release?**
            👉 Check out the Windows launcher for GPT4Free instead:
            🔗 [https://github.com/gpt4free/g4f.exe](https://github.com/gpt4free/g4f.exe) 🚀
          draft: false
          prerelease: false
          files: |
            ./artifacts/pypi-package/*
            ./artifacts/g4f-go-windows/dist/*
            ./artifacts/g4f-go-linux/dist/*
            ./artifacts/g4f-go-darwin/dist/*
            ./artifacts/g4f-go-freebsd/dist/*
          token: ${{ secrets.GITHUB_TOKEN }}

