<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Remote Desktop</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="screen" width="16" height="9"></canvas>
  <div id="hint">Tap <strong>Connect</strong> to start streaming.</div>
  <div id="latency"></div>
</div>

<div id="toolbar">
  <button id="btn-connect" class="primary">Connect</button>
  <button id="btn-control" disabled>Control</button>
  <button id="btn-keyboard" disabled>Keyboard</button>
  <button id="btn-fit">Fit</button>
  <button id="btn-fullscreen">Full</button>
</div>

<input id="soft-keys" type="text" autocomplete="off" autocorrect="off"
       autocapitalize="off" spellcheck="false" aria-hidden="true">

<div id="status">idle</div>

<script src="app.js"></script>
</body>
</html>
