# coturn configuration for the remote desktop relay.
#
# Install with deploy/setup-turn.sh, which fills in the placeholders below.
# The relay is what lets a phone on cellular reach this machine: without it the
# two browsers only ever learn their LAN addresses and ICE never pairs.

# --- listeners -------------------------------------------------------------
listening-port=3478
tls-listening-port=5349
listening-ip=__PRIVATE_IP__

# The address peers outside the LAN should be told to send media to. This
# machine sits behind a router, so coturn needs the public/private mapping
# ("public-ip/private-ip"): the public half is what remote peers are told to
# use, the private half is the interface coturn actually binds.
external-ip=__EXTERNAL_IP__/__PRIVATE_IP__

# Keep the relay range small so only a handful of ports need forwarding.
min-port=49160
max-port=49200

# --- authentication --------------------------------------------------------
# Time-limited credentials: the server mints username/password pairs with the
# shared secret (see remote_desktop.config.turn_credentials) and coturn
# verifies them without storing anything.
use-auth-secret
static-auth-secret=__TURN_SECRET__
realm=__REALM__

# --- hardening -------------------------------------------------------------
fingerprint
no-cli
no-multicast-peers
stale-nonce=600
total-quota=100

# --- logging ---------------------------------------------------------------
log-file=stdout
simple-log
