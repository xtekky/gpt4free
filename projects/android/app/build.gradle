plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// Version comes from the git tag in CI (-PappVersionName or G4F_VERSION env,
// e.g. v8.5.9 -> 8.5.9). Falls back to 0.1.0 for local builds.
def g4fVersionName = ((project.findProperty("appVersionName")
        ?: System.getenv("G4F_VERSION") ?: "0.1.0") as String).replaceFirst(/^v/, "")
def g4fVersionCode = 1
def versionMatch = (g4fVersionName =~ /(\d+)\.(\d+)\.(\d+)/)
if (versionMatch.find()) {
    g4fVersionCode = versionMatch.group(1).toInteger() * 10000
            + versionMatch.group(2).toInteger() * 100
            + versionMatch.group(3).toInteger()
}

android {
    namespace 'dev.g4f.android'
    compileSdk 34

    defaultConfig {
        applicationId "dev.g4f.android"
        minSdk 24
        targetSdk 34
        versionCode g4fVersionCode
        versionName g4fVersionName

        ndk {
            // Chaquopy supports: arm64-v8a, armeabi-v7a, x86, x86_64
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    chaquopy {
        defaultConfig {
            version "3.12"
            pip {
                install "requests"
                install "aiohttp"
                install "brotli"
                install "pycryptodome"
                install "nest-asyncio2"
                install "flask"
                install "asgiref"
                install "werkzeug"
                install "a2wsgi"
                install "certifi"
                install "pillow"
                install "cryptography"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

task copyG4fAssets(type: Copy) {
    // Only the Python package is embedded. GUI assets are NOT embedded:
    // g4f.gui's website.py fetches the chat UI from the g4f.dev CDN at
    // runtime when ./g4f.dev/dist is missing (same as a pip install).
    from("${rootDir}/../../g4f") {
        into("g4f")
        exclude "**/__pycache__", "**/*.pyc", "**/.git*"
    }
    into("src/main/assets")
}

preBuild.dependsOn copyG4fAssets

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}

