plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// Version comes from the git tag in CI (-PappVersionName or G4F_VERSION env,
// e.g. v8.5.9 -> 8.5.9). Local builds use the "2.0.0" fallback, which is the
// first version with the rootless Debian container and PTY terminal.
def g4fVersionProperty = project.findProperty("appVersionName")
        ?: System.getenv("G4F_VERSION")
def g4fVersionName = ((g4fVersionProperty ?: "2.0.0") as String).replaceFirst(/^v/, "")
// Local builds (no version property) get a high versionCode so the package
// installer never rejects them as a downgrade of an installed release APK
// (releases use e.g. 80900). Any build signed with a different key still
// needs an uninstall first, since Android refuses mismatching signatures.
// Keep the arithmetic on one line: Groovy ends the statement at the end of
// the first line, so a leading "+" on the next line is parsed separately and
// the code silently becomes just major * 10000 (20000 for the "2.0.0" fallback).
def g4fVersionCode = 999999
if (g4fVersionProperty != null) {
    def versionMatch = (g4fVersionName =~ /(\d+)\.(\d+)\.(\d+)/)
    if (versionMatch.find()) {
        g4fVersionCode = Math.max(1,
                versionMatch.group(1).toInteger() * 10000 + versionMatch.group(2).toInteger() * 100 + versionMatch.group(3).toInteger())
    } else {
        g4fVersionCode = 1
    }
}

// Stable release signing. Android will not install an APK signed with a key
// different from the installed one, so the release key must stay the same
// across local builds and CI releases. Configure it with a keystore file:
//
//   export G4F_KEYSTORE=~/keystores/g4f-release.jks
//   export G4F_KEYSTORE_PASSWORD=...
//   export G4F_KEY_ALIAS=g4f            # optional, defaults to "g4f"
//   export G4F_KEY_PASSWORD=...         # optional, defaults to the store password
//
// or with -Pg4fKeystore=... / -Pg4fKeystorePassword=... on the command line.
// Without a keystore the old behaviour is kept (debug key), so local
// assembleDebug builds keep working out of the box.
def g4fKeystorePath = project.findProperty("g4fKeystore") ?: System.getenv("G4F_KEYSTORE")
def g4fKeystoreFile = g4fKeystorePath ? file(g4fKeystorePath) : null
def g4fKeystorePassword = project.findProperty("g4fKeystorePassword")
        ?: System.getenv("G4F_KEYSTORE_PASSWORD")
def g4fKeyAlias = project.findProperty("g4fKeyAlias") ?: System.getenv("G4F_KEY_ALIAS") ?: "g4f"
def g4fKeyPassword = project.findProperty("g4fKeyPassword")
        ?: System.getenv("G4F_KEY_PASSWORD") ?: g4fKeystorePassword
def g4fHasReleaseKey = g4fKeystoreFile != null && g4fKeystoreFile.exists()
if (g4fKeystoreFile != null && !g4fHasReleaseKey) {
    logger.warn("G4F_KEYSTORE points to a missing file (${g4fKeystoreFile}); release builds will use the debug key")
}
if (g4fHasReleaseKey && g4fKeystorePassword == null) {
    logger.warn("G4F_KEYSTORE is set but G4F_KEYSTORE_PASSWORD is empty; signing will fail")
}

android {
    namespace 'dev.g4f.android'
    compileSdk 34

    defaultConfig {
        applicationId "dev.g4f.android"
        minSdk 24
        targetSdk 34
        versionCode g4fVersionCode
        versionName g4fVersionName

        ndk {
            // Chaquopy and the container catalog both support these ABIs.
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    chaquopy {
        defaultConfig {
            version "3.12"
            pip {
                install "requests"
                install "aiohttp"
                // Chaquopy provides Android wheels for this version on both bundled ABIs.
                install "brotli==1.1.0"
                install "pycryptodome"
                install "nest-asyncio2"
                install "flask"
                install "asgiref"
                install "werkzeug"
                install "a2wsgi"
                install "certifi"
                install "pillow"
                install "cryptography"
            }
        }
    }

    // Optional stable release key; falls back to the debug key so a plain
    // checkout still builds and installs (with an uninstall once).
    signingConfigs {
        if (g4fHasReleaseKey) {
            release {
                storeFile g4fKeystoreFile
                storePassword g4fKeystorePassword
                keyAlias g4fKeyAlias
                keyPassword g4fKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.findByName("release") ?: signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        // PRoot and its loader are exec'd from nativeLibraryDir, so AGP must
        // extract the native libraries instead of loading them from the APK.
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

// One APK asset tree cannot hold both architectures; default to arm64-v8a.
// (The property name is kept for existing CI invocations.)
def containerPythonAbi = project.findProperty("containerPythonAbi") ?: "arm64-v8a"

// sandbox-cli (and the installers it launches) need curl. The pinned static
// musl build embeds a CA bundle, so it works without apt or system certs.
task prepareCurlBinary(type: Exec) {
    dependsOn 'copyG4fAssets'
    commandLine 'python3', "${rootDir}/prepare_curl.py", '--abi', containerPythonAbi
    inputs.file("src/main/assets/container/catalog.json")
    inputs.file("${rootDir}/prepare_curl.py")
    inputs.file("${rootDir}/prepare_proot.py")
    outputs.dir("build/curl-bin")
}

// The container's /desktop/ client is built from the pinned upstream noVNC
// release plus the sandbox-desktop branding/touch controls. Generated files
// stay out of git; the APK gets them from src/main/assets/container/scripts/novnc.
task prepareNovncClient(type: Exec) {
    dependsOn 'copyG4fAssets'
    commandLine 'python3', "${rootDir}/prepare_novnc.py"
    inputs.file("src/main/assets/container/catalog.json")
    inputs.file("${rootDir}/prepare_novnc.py")
    inputs.file("${rootDir}/prepare_proot.py")
    inputs.file("${rootDir}/../../bin/novnc-brand.sh")
    inputs.file("${rootDir}/../../docker/g4f.svg")
    inputs.file("${rootDir}/../../docker/novnc-index.html")
    inputs.file("${rootDir}/../../docker/novnc-controls.js")
    inputs.file("${rootDir}/../../docker/novnc-controls.css")
    inputs.file("${rootDir}/../../docker/novnc-manifest.webmanifest")
    inputs.file("${rootDir}/../../docker/novnc-sw.js")
    outputs.dir("${rootDir}/build/novnc-client")
}

task copyNovncAssets(type: Copy) {
    dependsOn prepareNovncClient
    doFirst {
        delete("src/main/assets/container/scripts/novnc")
    }
    from("${rootDir}/build/novnc-client")
    into("src/main/assets/container/scripts/novnc")
}

// All repository bin commands go into the container's PATH. The Linux arm64
// g4f-go binary runs under Debian/PRoot; the Android build is kept separately
// for Termux installs and is not executable from the Debian rootfs.
task copyContainerBinAssets(type: Copy) {
    dependsOn prepareCurlBinary
    from("${rootDir}/../../bin") {
        include "*"
    }
    from("${rootDir}/../../g4f-go/dist/linux-arm64/g4f-go") {
        rename { "g4f-go" }
    }
    from("${rootDir}/build/curl-bin/${containerPythonAbi}/curl") {
        rename { "curl" }
    }
    into("src/main/assets/container/bin")
}

// g4f-go manages the container's CPython runtime. Nothing Python-related is
// extracted or committed here; the launcher downloads the pinned archive on
// first use and installs the bundled g4f source into it.
task copyG4fAssets(type: Copy) {
    // Only the Python package is embedded. GUI assets are NOT embedded:
    // g4f.gui's website.py fetches the chat UI from the g4f.dev CDN at
    // runtime when ./g4f.dev/dist is missing (same as a pip install).
    from("${rootDir}/../../g4f") {
        into("g4f")
        exclude "**/__pycache__", "**/*.pyc", "**/.git*"
    }
    // The container installs gpt4free with pip from the same source tree.
    from("${rootDir}/../..") {
        include "setup.py", "README.md", "requirements.txt"
        into "g4f"
    }
    into("src/main/assets")
}

// Android blocks execve() from app-writable storage, so PRoot and its static
// loader are extracted from the pinned Termux .deb into jniLibs before AGP
// packages the APK. They end up in the read-only nativeLibraryDir.
task prepareProotLibs(type: Exec) {
    dependsOn copyG4fAssets
    commandLine 'python3', "${rootDir}/prepare_proot.py"
    inputs.file("src/main/assets/container/catalog.json")
    inputs.file("${rootDir}/prepare_proot.py")
    outputs.dir("src/main/jniLibs")
}

preBuild.dependsOn copyG4fAssets, copyContainerBinAssets, copyNovncAssets, prepareProotLibs

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    // Debian rootfs (.tar.gz) and Termux runtime packages (.deb -> ar -> data.tar.xz).
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation 'org.tukaani:xz:1.9'
}

['Debug', 'Release'].each { variant ->
    def verify = tasks.register("verifyBrotli${variant}", Exec) {
        def apk = layout.buildDirectory.file("outputs/apk/${variant.toLowerCase()}/app-${variant.toLowerCase()}.apk")
        commandLine 'python3', "${rootDir}/check_brotli.py", apk.get().asFile
    }
    tasks.matching { it.name == "assemble${variant}" }.configureEach {
        finalizedBy verify
    }
}
